<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#3a0b0b"/>
      <stop offset="100%" stop-color="#200606"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- faint code texture -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ff9d9d" opacity="0.10">
    <text x="20" y="24">def get_user(email, password):</text>
    <text x="20" y="44">    cursor = connection.cursor(DictCursor)</text>
    <text x="20" y="64">    cursor.execute('SELECT * FROM user WHERE email = %s', (email,))</text>
    <text x="20" y="84">    user = cursor.fetchone()</text>
    <text x="20" y="104">    if user:</text>
    <text x="20" y="124">        session['loggedin'] = True</text>
    <text x="20" y="144">        return redirect('/dashboard')</text>
    <text x="700" y="230">[Running] python -u "app.py"</text>
    <text x="700" y="250">* Serving Flask app 'app'</text>
    <text x="700" y="270">* Debug mode: on</text>
    <text x="20" y="270">git commit -m "ship it" &amp;&amp; git push origin main</text>
  </g>

  <!-- divider -->
  <rect x="0" y="150" width="1200" height="1" fill="#ffcc33" opacity="0.25"/>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="700" fill="url(#goldGrad)" filter="url(#glow)"
        letter-spacing="4">RAKHI GAUD</text>

  <!-- subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="'Brush Script MT', cursive"
        font-size="34" font-style="italic" fill="#f5f5f5" opacity="0.92">Engineering Student</text>

  <!-- tagline -->
  <text x="600" y="235" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="15" fill="#ffcc33" opacity="0.85" letter-spacing="2">AI · ML · BACKEND DEVELOPMENT</text>
</svg>
