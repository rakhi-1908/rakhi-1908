<svg xmlns="http://www.w3.org/2000/svg" width="800" height="442" viewBox="0 0 800 442"><style>text{font-family:'Fira Code','JetBrains Mono','Courier New',monospace;}</style><rect x="10" y="10" width="786" height="428" rx="6" fill="#8B0F14"/><rect x="4" y="4" width="786" height="428" rx="6" fill="#1a0505" stroke="#FFD73C" stroke-width="3"/><circle cx="26" cy="20" r="5" fill="#FF3B4E"/><circle cx="44" cy="20" r="5" fill="#FFD73C"/><circle cx="62" cy="20" r="5" fill="#FFE98A"/><text x="26" y="54" font-size="14" xml:space="preserve"><tspan fill="#FF3B4E">class </tspan><tspan fill="#FFD73C">Rakhi</tspan><tspan fill="#FFE98A">:</tspan></text><text x="26" y="78" font-size="14" xml:space="preserve"><tspan fill="#FF3B4E">    def </tspan><tspan fill="#FFD73C">__init__</tspan><tspan fill="#FFE98A">(self):</tspan></text><text x="26" y="102" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        self.role     = </tspan><tspan fill="#FFD73C">&quot;B.Tech Artificial Intelligence student&quot;</tspan></text><text x="26" y="126" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        self.school   = </tspan><tspan fill="#FFD73C">&quot;Usha Mittal Institute of Technology,</tspan></text><text x="26" y="150" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">                         </tspan><tspan fill="#FFD73C">SNDT Women&#x27;s University&quot;</tspan></text><text x="26" y="174" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        self.based_in = </tspan><tspan fill="#FFD73C">&quot;Mumbai, India&quot;</tspan></text><text x="26" y="198" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        self.timeline = </tspan><tspan fill="#FFD73C">&quot;2023 — 2027&quot;</tspan></text><text x="26" y="222" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        self.building = </tspan><tspan fill="#FFD73C">[&quot;Votify&quot;, &quot;DustVigil&quot;]</tspan></text><text x="26" y="246" font-size="14" xml:space="preserve"><tspan fill="#FFE98A"></tspan></text><text x="26" y="270" font-size="14" xml:space="preserve"><tspan fill="#FF3B4E">    def </tspan><tspan fill="#FFD73C">bio</tspan><tspan fill="#FFE98A">(self):</tspan></text><text x="26" y="294" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        return (</tspan></text><text x="26" y="318" font-size="14" xml:space="preserve"><tspan fill="#FFD73C">            &quot;I build AI-integrated apps and hardware-connected systems —</tspan></text><text x="26" y="342" font-size="14" xml:space="preserve"><tspan fill="#FFD73C">            from a biometric election platform to an autonomous</tspan></text><text x="26" y="366" font-size="14" xml:space="preserve"><tspan fill="#FFD73C">            pollution-control pod. I like projects where software has</tspan></text><text x="26" y="390" font-size="14" xml:space="preserve"><tspan fill="#FFD73C">            to deal with the real, messy world.&quot;</tspan></text><text x="26" y="414" font-size="14" xml:space="preserve"><tspan fill="#FFE98A">        )</tspan></text></svg>