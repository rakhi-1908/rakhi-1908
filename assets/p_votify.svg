<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220"><style>text{font-family:'Fira Code','JetBrains Mono','Courier New',monospace;}</style><rect x="10" y="10" width="786" height="206" rx="6" fill="#8B0F14"/><rect x="4" y="4" width="786" height="206" rx="6" fill="#1a0505" stroke="#FFD73C" stroke-width="3"/><text x="26" y="52" font-size="22" font-weight="700" fill="#FFD73C">Votify</text><rect x="649" y="30" width="113" height="26" rx="13" fill="#FF3B4E"/><text x="705.5" y="48" font-size="13" font-weight="700" text-anchor="middle" fill="#1a0505">in progress</text><text x="26" y="72" font-size="12" fill="#FF3B4E">votify/</text><text x="26" y="100" font-size="14" fill="#FFE98A" xml:space="preserve">Blockchain-based, biometric, geofenced election platform. Flutter frontend</text><text x="26" y="122" font-size="14" fill="#FFE98A" xml:space="preserve">across seven core entities — voters, booths, candidates, a vote ledger,</text><text x="26" y="144" font-size="14" fill="#FFE98A" xml:space="preserve">constituencies, and an AI alerting module — with biometric auth, geofence</text><text x="26" y="166" font-size="14" fill="#FFE98A" xml:space="preserve">validation, and hash-chained vote integrity.</text><rect x="26" y="180" width="74.80000000000001" height="24" rx="4" fill="none" stroke="#FF3B4E" stroke-width="2"/><text x="63.400000000000006" y="196" font-size="12.5" text-anchor="middle" fill="#FF3B4E">Flutter</text><rect x="110.80000000000001" y="180" width="100.0" height="24" rx="4" fill="none" stroke="#FF3B4E" stroke-width="2"/><text x="160.8" y="196" font-size="12.5" text-anchor="middle" fill="#FF3B4E">Blockchain</text><rect x="220.8" y="180" width="125.2" height="24" rx="4" fill="none" stroke="#FF3B4E" stroke-width="2"/><text x="283.40000000000003" y="196" font-size="12.5" text-anchor="middle" fill="#FF3B4E">System Design</text><rect x="356.0" y="180" width="100.0" height="24" rx="4" fill="none" stroke="#FF3B4E" stroke-width="2"/><text x="40